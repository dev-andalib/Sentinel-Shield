<!DOCTYPE html>
<html>
<head>
  <title>Sentinel Shield Settings</title>
  <style>
    body { font-family: sans-serif; width: 250px; padding: 10px; }
    textarea { width: 95%; height: 100px; margin-bottom: 10px; }
    button { width: 100%; padding: 8px; background-color: #4CAF50; color: white; border: none; cursor: pointer; }
    button:hover { background-color: #45a049; }
    
    /* Mask styling */
    .sentinel-mask {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.95);
      color: white;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .sentinel-mask-button {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      background: #4CAF50;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 4px;
    }
    .sentinel-mask-button:hover {
      background: #45a049;
    }
  </style>
</head>
<body>
  <h3>Personalized Triggers</h3>
  <p>Enter keywords to mask, separated by commas.</p>
  <textarea id="keywords"></textarea>
  <button id="save">Save</button>
  <script src="popup.js"></script>
</body>
</html>
